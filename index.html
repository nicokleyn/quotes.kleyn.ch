// CANVAS SETUP
// ═══════════════════════════════════════════════════
const SIZE = 800;
const canvas = document.getElementById('main');
const ctx = canvas.getContext('2d');
const offscreen = document.createElement('canvas');
const offCtx = offscreen.getContext('2d');

// ═══════════════════════════════════════════════════
// IMAGE LOADING — local files with generated fallback
// ═══════════════════════════════════════════════════
const imageCache = new Map();

function seededRandom(seed) {
  let s = seed;
  return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
}

function generateFallbackPortrait(woman) {
  const c = document.createElement('canvas');
  c.width = SIZE; c.height = SIZE;
  const g = c.getContext('2d');
  const rand = seededRandom(woman.seed * 7919);
  const p = woman.palette;

  g.fillStyle = p[0]; g.fillRect(0, 0, SIZE, SIZE);

  const cx = SIZE * (0.35 + rand() * 0.3);
  const cy = SIZE * (0.2 + rand() * 0.25);
  const gr = g.createRadialGradient(cx, cy, 10, cx, cy, SIZE * 0.65);
  gr.addColorStop(0, p[3] + 'dd');
  gr.addColorStop(0.3, p[2] + '88');
  gr.addColorStop(0.7, p[1] + '44');
  gr.addColorStop(1, 'transparent');
  g.fillStyle = gr; g.fillRect(0, 0, SIZE, SIZE);

  for (let i = 0; i < 60; i++) {
    g.save();
    const x = rand() * SIZE, y = rand() * SIZE;
    g.translate(x, y);
    g.rotate((rand() - 0.5) * 0.8);
    const alpha = (20 + rand() * 60) | 0;
    g.fillStyle = p[(rand() * p.length) | 0] + alpha.toString(16).padStart(2, '0');
    g.fillRect(-(30 + rand() * 180) / 2, -(20 + rand() * 120) / 2, 30 + rand() * 180, 20 + rand() * 120);
    g.restore();
  }

  const fg = g.createRadialGradient(cx, cy, 5, cx, cy, SIZE * 0.35);
  fg.addColorStop(0, p[4] + '88');
  fg.addColorStop(0.5, p[3] + '44');
  fg.addColorStop(1, 'transparent');
  g.fillStyle = fg; g.fillRect(0, 0, SIZE, SIZE);

  for (let i = 0; i < 80; i++) {
    const x = cx + (rand() - 0.5) * SIZE * 0.8;
    const y = cy + (rand() - 0.5) * SIZE * 0.8;
    const r = 5 + rand() * 30;
    g.beginPath();
    g.ellipse(x, y, r, r * (0.4 + rand()), rand() * Math.PI, 0, Math.PI * 2);
    const a2 = (15 + rand() * 50) | 0;
    g.fillStyle = p[(rand() * p.length) | 0] + a2.toString(16).padStart(2, '0');
    g.fill();
  }

  const img = new Image();
  img.src = c.toDataURL();
  return img;
}

function loadImage(woman) {
  return new Promise((resolve) => {
    if (imageCache.has(woman.name)) { resolve(imageCache.get(woman.name)); return; }

    if (!woman.img) {
      const fb = generateFallbackPortrait(woman);
      imageCache.set(woman.name, fb);
      resolve(fb);
      return;
    }

    const img = new Image();
    img.onload = () => { imageCache.set(woman.name, img); resolve(img); };
    img.onerror = () => {
      console.warn(`Failed to load ${woman.img}, using generated portrait`);
      const fb = generateFallbackPortrait(woman);
      imageCache.set(woman.name, fb);
      resolve(fb);
    };
    img.src = woman.img;
  });
}

// Preload ahead
function preloadAhead(startIdx, count) {
  for (let i = 0; i < count; i++) {
    loadImage(women[(startIdx + i) % women.length]);
  }
}

// ═══════════════════════════════════════════════════
// RENDERING
// ═══════════════════════════════════════════════════

function drawPixelated(image, gridSize) {
  if (!image) return;
  const gs = Math.max(2, Math.round(gridSize));
  offscreen.width = gs; offscreen.height = gs;

  // Cover-crop to square
  const iw = image.naturalWidth || image.width || gs;
  const ih = image.naturalHeight || image.height || gs;
  const scale = Math.max(gs / iw, gs / ih);
  const sw = iw * scale, sh = ih * scale;
  offCtx.drawImage(image, (gs - sw) / 2, (gs - sh) / 2, sw, sh);

  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(offscreen, 0, 0, gs, gs, 0, 0, SIZE, SIZE);
}

function drawChessOverlay(alpha) {
  if (alpha <= 0) return;
  const sq = SIZE / 8;
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const isLight = (r + c) % 2 === 0;
      ctx.fillStyle = isLight
        ? `rgba(224,221,216,${alpha})`
        : `rgba(100,96,90,${alpha})`;
      ctx.fillRect(c * sq, r * sq, sq, sq);
    }
  }
  if (alpha > 0.2) {
    ctx.strokeStyle = `rgba(60,56,50,${alpha * 0.35})`;
    ctx.lineWidth = 1.5;
    for (let i = 1; i < 8; i++) {
      ctx.beginPath();
      ctx.moveTo(i * sq, 0); ctx.lineTo(i * sq, SIZE);
      ctx.moveTo(0, i * sq); ctx.lineTo(SIZE, i * sq);
      ctx.stroke();
    }
  }
}

function drawQuoteWords(text, alpha) {
  if (alpha <= 0) return;
  const words = text.split(/\s+/);
  const n = words.length;
  const sq = SIZE / 8;

  const positions = [];
  if (n >= 64) {
    for (let i = 0; i < 64; i++) positions.push(i);
  } else {
    const used = new Set();
    for (let w = 0; w < n; w++) {
      let pos = Math.round(w * 63 / (n - 1 || 1));
      while (used.has(pos) && pos < 64) pos++;
      if (pos >= 64) { pos = 0; while (used.has(pos)) pos++; }
      used.add(pos);
      positions.push(pos);
    }
    positions.sort((a, b) => a - b);
  }

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const fontSize = Math.max(14, sq * 0.28);
  ctx.font = `italic 600 ${fontSize}px Georgia, serif`;

  for (let w = 0; w < Math.min(n, positions.length); w++) {
    const idx = positions[w];
    const row = (idx / 8) | 0, col = idx % 8;
    const isLight = (row + col) % 2 === 0;
    ctx.fillStyle = isLight
      ? `rgba(42,42,42,${alpha})`
      : `rgba(240,236,230,${alpha})`;
    ctx.fillText(words[w], col * sq + sq / 2, row * sq + sq / 2, sq - 6);
  }
}

function drawQuoteOverlay(woman, alpha) {
  if (alpha <= 0) return;
  const gradH = SIZE * 0.40;
  const grad = ctx.createLinearGradient(0, SIZE - gradH, 0, SIZE);
  grad.addColorStop(0, `rgba(10,10,10,0)`);
  grad.addColorStop(0.3, `rgba(10,10,10,${alpha * 0.75})`);
  grad.addColorStop(1, `rgba(10,10,10,${alpha * 0.9})`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, SIZE - gradH, SIZE, gradH);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'bottom';
  const qSize = SIZE * 0.038;
  ctx.font = `italic 400 ${qSize}px Georgia, serif`;
  ctx.fillStyle = `rgba(240,236,230,${alpha})`;

  const maxW = SIZE * 0.85;
  const words = woman.quote.split(/\s+/);
  const lines = []; let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW) { lines.push(line); line = w; }
    else { line = test; }
  }
  if (line) lines.push(line);

  const lineH = qSize * 1.6;
  const startY = SIZE - 36 - lineH;
  for (let i = lines.length - 1; i >= 0; i--) {
    const prefix = i === 0 ? '\u201C' : '';
    const suffix = i === lines.length - 1 ? '\u201D' : '';
    ctx.fillText(`${prefix}${lines[i]}${suffix}`,
      SIZE / 2, startY - (lines.length - 1 - i) * lineH);
  }

  const nSize = SIZE * 0.026;
  ctx.font = `600 ${nSize}px Georgia, serif`;
  ctx.fillStyle = `rgba(200,184,154,${alpha})`;
  ctx.fillText(`\u2014 ${woman.name.toUpperCase()}`, SIZE / 2, SIZE - 16);
}

function drawVignette(alpha) {
  if (alpha <= 0) return;
  const vig = ctx.createRadialGradient(SIZE/2, SIZE/2, SIZE*0.28, SIZE/2, SIZE/2, SIZE*0.72);
  vig.addColorStop(0, 'transparent');
  vig.addColorStop(1, `rgba(10,10,10,${alpha})`);
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, SIZE, SIZE);
}

// ═══════════════════════════════════════════════════
// ANIMATION ENGINE
// ═══════════════════════════════════════════════════

const T_PORTRAIT = 3500;   // Hold full portrait + quote overlay
const T_PIXDOWN  = 3000;   // Pixelate down to 8×8
const T_CHESS    = 5500;   // Hold chess grid with scattered quote words
const T_PIXUP    = 3000;   // Mosaic up from 8×8 to next portrait
const T_TOTAL = T_PORTRAIT + T_PIXDOWN + T_CHESS + T_PIXUP;

function getPhase(elapsed) {
  if (elapsed < T_PORTRAIT) return { phase: 'portrait', t: elapsed / T_PORTRAIT };
  elapsed -= T_PORTRAIT;
  if (elapsed < T_PIXDOWN) return { phase: 'pixdown', t: elapsed / T_PIXDOWN };
  elapsed -= T_PIXDOWN;
  if (elapsed < T_CHESS) return { phase: 'chess', t: elapsed / T_CHESS };
  elapsed -= T_CHESS;
  return { phase: 'pixup', t: Math.min(elapsed / T_PIXUP, 1) };
}

function easeInOutCubic(t) { return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2; }
function easeOutQuad(t) { return 1 - (1-t)*(1-t); }
function easeInQuad(t) { return t * t; }

const GRID_MIN = 8;
const GRID_MAX = 400;
function gridLerp(t01) {
  return GRID_MIN * Math.pow(GRID_MAX / GRID_MIN, t01);
}

let currentIdx = 0;
let cycleStart = 0;

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}
shuffle(women);
preloadAhead(0, 6);

function render(timestamp) {
  if (!cycleStart) cycleStart = timestamp;
  const elapsed = timestamp - cycleStart;

  if (elapsed >= T_TOTAL) {
    currentIdx = (currentIdx + 1) % women.length;
    cycleStart = timestamp;
    preloadAhead(currentIdx, 6);
    requestAnimationFrame(render);
    return;
  }

  const { phase, t } = getPhase(elapsed);
  const woman = women[currentIdx];
  const nextWoman = women[(currentIdx + 1) % women.length];
  const img = imageCache.get(woman.name);
  const nextImg = imageCache.get(nextWoman.name);

  ctx.clearRect(0, 0, SIZE, SIZE);
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(0, 0, SIZE, SIZE);

  const eraEl = document.getElementById('eraLabel');
  const nameEl = document.getElementById('nameLabel');
  const bioEl = document.getElementById('bioLabel');
  const quoteEl = document.getElementById('quoteLabel');

  // ── PHASE 1: Full portrait with quote ──
  if (phase === 'portrait') {
    if (img) drawPixelated(img, SIZE);
    drawVignette(0.5);
    eraEl.textContent = woman.era;
    eraEl.classList.add('visible');
    nameEl.textContent = `\u2014 ${woman.name}`;
    nameEl.classList.add('visible');
    bioEl.textContent = woman.bio;
    bioEl.classList.add('visible');
    quoteEl.textContent = `\u201C${woman.quote}\u201D`;
    quoteEl.classList.add('visible');
    const quoteAlpha = t > 0.4 ? easeOutQuad((t - 0.4) / 0.6) : 0;
    drawQuoteOverlay(woman, quoteAlpha);
  }

  // ── PHASE 2: Pixelate DOWN to 8×8 ──
  else if (phase === 'pixdown') {
    const eased = easeInOutCubic(t);
    const gs = gridLerp(1 - eased);
    if (img) drawPixelated(img, gs);

    const chessAlpha = eased > 0.5 ? easeOutQuad((eased - 0.5) / 0.5) * 0.5 : 0;
    drawChessOverlay(chessAlpha);

    const quoteAlpha = t < 0.25 ? 1 : 1 - easeInQuad((t - 0.25) / 0.75);
    drawQuoteOverlay(woman, quoteAlpha);

    eraEl.classList.add('visible');
    nameEl.classList.add('visible');
    bioEl.textContent = woman.bio;
    bioEl.classList.add('visible');
    quoteEl.textContent = `\u201C${woman.quote}\u201D`;
    quoteEl.classList.add('visible');
  }

  // ── PHASE 3: Chess grid with quote words ──
  else if (phase === 'chess') {
    if (img) drawPixelated(img, 8);
    drawChessOverlay(0.5);

    const wordAlpha = t < 0.08 ? easeOutQuad(t / 0.08)
                    : t > 0.88 ? 1 - easeInQuad((t - 0.88) / 0.12) : 1;
    drawQuoteWords(woman.quote, wordAlpha);

    // Subtle grid lines
    const sq = SIZE / 8;
    ctx.strokeStyle = 'rgba(50,46,40,0.2)';
    ctx.lineWidth = 2;
    for (let i = 1; i < 8; i++) {
      ctx.beginPath();
      ctx.moveTo(i * sq, 0); ctx.lineTo(i * sq, SIZE);
      ctx.moveTo(0, i * sq); ctx.lineTo(SIZE, i * sq);
      ctx.stroke();
    }

    eraEl.classList.add('visible');
    nameEl.classList.add('visible');
    bioEl.textContent = woman.bio;
    bioEl.classList.add('visible');
    quoteEl.textContent = `\u201C${woman.quote}\u201D`;
    quoteEl.classList.add('visible');
  }

  // ── PHASE 4: Mosaic UP to next woman ──
  else if (phase === 'pixup') {
    const eased = easeInOutCubic(t);
    const gs = gridLerp(eased);
    const useNext = eased > 0.05;
    const drawImg = useNext ? (nextImg || img) : img;
    if (drawImg) drawPixelated(drawImg, gs);

    const chessAlpha = eased < 0.35 ? 0.5 * (1 - easeOutQuad(eased / 0.35)) : 0;
    drawChessOverlay(chessAlpha);

    if (eased > 0.7) drawVignette(0.5 * easeOutQuad((eased - 0.7) / 0.3));

    // Label crossfade
    if (eased < 0.15) {
      eraEl.classList.add('visible');
      nameEl.classList.add('visible');
      bioEl.textContent = woman.bio;
      bioEl.classList.add('visible');
      quoteEl.textContent = `\u201C${woman.quote}\u201D`;
      quoteEl.classList.add('visible');
    } else if (eased < 0.35) {
      eraEl.classList.remove('visible');
      nameEl.classList.remove('visible');
      bioEl.classList.remove('visible');
      quoteEl.classList.remove('visible');
    } else if (eased > 0.65) {
      eraEl.textContent = nextWoman.era;
      nameEl.textContent = `\u2014 ${nextWoman.name}`;
      bioEl.textContent = nextWoman.bio;
      quoteEl.textContent = `\u201C${nextWoman.quote}\u201D`;
      eraEl.classList.add('visible');
      nameEl.classList.add('visible');
      bioEl.classList.add('visible');
      quoteEl.classList.add('visible');
    }
  }

  // Timer bar
  document.getElementById('timerFill').style.width =
    Math.min((elapsed / T_TOTAL) * 100, 100) + '%';

  requestAnimationFrame(render);
}

// ═══════════════════════════════════════════════════
// BOOT — wait for first image, then start
// ═══════════════════════════════════════════════════
loadImage(women[0]).then(() => {
  requestAnimationFrame(render);
});
</script>
</body>
